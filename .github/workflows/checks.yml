name: Source checks

on:
  push:
  pull_request:

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synthetic ISO and ELF tests
        run: python -m unittest discover -s tests -v
      - name: No game data or build artifacts in the repository
        run: python tools/check_repository.py
